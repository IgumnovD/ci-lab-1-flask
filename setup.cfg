# =========================================================
# САМОСТОЯТЕЛЬНАЯ РАБОТА
# =========================================================
#
# Настройте здесь pytest/pytest-cov так, чтобы Pipeline
# завершался с ошибкой, если покрытие кода меньше 80%.
#
# Используйте требования раздела 5.3 лабораторной работы.
# =========================================================
[tool:pytest]
testpaths = tests
pythonpath = .
addopts = --cov=app --cov-report=term --cov-report=xml --cov-fail-under=80
norecursedirs = tests/integration

[coverage:run]
omit = app/visits.py

[coverage:report]
exclude_lines =
    def initialize_database

[flake8]
max-line-length = 100
exclude = venv,.venv,__pycache__,.pytest_cache
