apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      initContainers:
        - name: init-db
          image: ghcr.io/igumnovd/myapp-staging:initial
          command: ["flask", "--app", "run", "init-db"]
          envFrom:
            - secretRef:
                name: myapp-services
      containers:
        - name: myapp
          image: ghcr.io/igumnovd/myapp-staging:initial
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: myapp-services
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
