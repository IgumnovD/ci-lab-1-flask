# =========================================================
# САМОСТОЯТЕЛЬНАЯ РАБОТА
# =========================================================
#
# Разработайте CI-пайплайн согласно разделу 5.4.1.
#
# Необходимо самостоятельно настроить:
# 1. запуск при push в main;
# 2. запуск при Pull Request в main;
# 3. Ubuntu;
# 4. checkout исходного кода;
# 5. установку Python с кэшированием;
# 6. установку зависимостей;
# 7. lint;
# 8. тесты с покрытием / Quality Gate;
# 9. build;
# 10. при желании — сохранение отчёта покрытия.
#
# Готовый workflow здесь намеренно не приводится.
# =========================================================
name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 app tests

      - name: Test with coverage
        run: pytest

      - name: Build
        run: python -m compileall app

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml