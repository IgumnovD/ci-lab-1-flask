# =========================================================
# САМОСТОЯТЕЛЬНАЯ РАБОТА
# =========================================================
#
# Разработайте CI-пайплайн согласно разделу 5.4.1.
#
# Необходимо самостоятельно настроить:
# 1. запуск при push в main;
# 2. запуск при Pull Request в main;
# 3. Ubuntu;
# 4. checkout исходного кода;
# 5. установку Python с кэшированием;
# 6. установку зависимостей;
# 7. lint;
# 8. тесты с покрытием / Quality Gate;
# 9. build;
# 10. при желании — сохранение отчёта покрытия.
#
# Готовый workflow здесь намеренно не приводится.
# =========================================================
name: Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


permissions:        
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 app tests

      - name: Test with coverage
        run: pytest

      - name: Build
        run: python -m compileall app

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
      - name: Настройка Buildx
        uses: docker/setup-buildx-action@v3

      - name: Определение короткого SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Сборка образа (без публикации) с кэшированием слоёв
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: myapp:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy — полный отчёт (текст)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:${{ env.SHORT_SHA }}
          format: table
          output: trivy-report.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 0 
      - name: Загрузить Trivy-отчёт как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Trivy — Quality Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:${{ env.SHORT_SHA }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Генерация SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:${{ env.SHORT_SHA }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: 0

      - name: Загрузить SBOM как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json


      - name: Логин в GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация в GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/myapp
          docker tag myapp:${{ env.SHORT_SHA }} $IMAGE:${{ env.SHORT_SHA }}
          docker tag myapp:${{ env.SHORT_SHA }} $IMAGE:${{ github.run_number }}
          docker push $IMAGE:${{ env.SHORT_SHA }}
          docker push $IMAGE:${{ github.run_number }}