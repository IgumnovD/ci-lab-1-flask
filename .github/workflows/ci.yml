name: CI and staging promotion
on:
  push:
    branches: [main, lab3-integration-promotion]
    paths-ignore:
      - 'k8s-manifests/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: flake8 app tests
      - run: pytest tests/test_app.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sequential timing
        run: /usr/bin/time -p -o sequential-time.txt pytest tests/integration --no-cov --junitxml=sequential-results.xml --log-cli-level=WARNING
      - name: Parallel timing
        run: /usr/bin/time -p -o parallel-time.txt pytest tests/integration --no-cov -n auto --junitxml=parallel-results.xml --log-cli-level=WARNING
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            *-time.txt
            *-results.xml

  build:
    needs: integration-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.image.outputs.tag }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        name: Image identity
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/myapp" >> "$GITHUB_OUTPUT"
      - name: Настройка Buildx
        uses: docker/setup-buildx-action@v3

      - name: Определение короткого SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Сборка образа (без публикации) с кэшированием слоёв
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: myapp:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy — полный отчёт (текст)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:${{ env.SHORT_SHA }}
          format: table
          output: trivy-report.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: 0 
      - name: Загрузить Trivy-отчёт как артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Trivy — Quality Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:${{ env.SHORT_SHA }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Генерация SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: myapp:${{ env.SHORT_SHA }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: 0

      - name: Загрузить SBOM как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json


      - name: Логин в GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Публикация в GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/myapp
          docker tag myapp:${{ env.SHORT_SHA }} $IMAGE:${{ env.SHORT_SHA }}
          docker tag myapp:${{ env.SHORT_SHA }} $IMAGE:${{ github.run_number }}
          docker push $IMAGE:${{ env.SHORT_SHA }}
          docker push $IMAGE:${{ github.run_number }}
  promote-to-staging:
    needs: [integration-tests, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.promote.outputs.image }}
    steps:
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Copy verified image without rebuilding
        id: promote
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin
          SOURCE="docker://${IMAGE}:${TAG}"
          TARGET="docker://${IMAGE}-staging:${TAG}"
          skopeo copy --all --preserve-digests "$SOURCE" "$TARGET"
          skopeo inspect "$TARGET" | tee staging-image.json
          test "$(skopeo inspect --format '{{.Digest}}' "$SOURCE")" = "$(skopeo inspect --format '{{.Digest}}' "$TARGET")"
          echo "image=${IMAGE}-staging:${TAG}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: staging-image
          path: staging-image.json

  update-manifest:
    needs: promote-to-staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.3
      - name: Update desired staging state in Git
        env:
          STAGING_IMAGE: ${{ needs.promote-to-staging.outputs.image }}
        run: |
          python scripts/update_manifest.py
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add k8s-manifests/staging/deployment.yaml
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached
          git commit -m "Deploy ${STAGING_IMAGE##*:} to staging [skip ci]"
          git push origin HEAD:main
          git log -p -1 -- k8s-manifests/staging/deployment.yaml
